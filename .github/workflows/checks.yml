name: Frontend checks
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project="${{ matrix.browser == 'chromium' && 'chromium-*' || matrix.browser }}"
        env:
          PLAYWRIGHT_ALL_BROWSERS: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.browser }}-browser-failure-traces
          path: test-results/
          retention-days: 7
